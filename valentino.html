<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALENTINO</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            color: white;
            text-align: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            position: relative;
        }

        /* Letter by Letter Happy Valentine's Day */
        .valentine-header {
            font-size: 4rem;
            font-weight: bold;
            color: white;
            margin-top: 20px;
            letter-spacing: 5px;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        h1 {
            font-size: 4rem;
            background: linear-gradient(to right, #ff4a4a, #b14cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.5);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 0, 0, 0.5);
        }

        input {
            width: 250px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ff4a4a;
            background: black;
            color: white;
            border-radius: 5px;
        }

        .btn {
            background: linear-gradient(to right, #ff4a4a, #b14cff);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .music-btn {
            background: #ff4a4a;
            color: white;
            border: none;
            padding: 10px 15px;
            position: absolute;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0px 0px 10px rgba(255, 0, 0, 0.5);
        }

        .music-btn:hover {
            background: #b14cff;
            transform: scale(1.1);
        }

        /* Floating Tulips */
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .tulip {
            position: absolute;
            font-size: 50px;
            text-shadow: 0 0 20px yellow, 0 0 40px yellow;
            opacity: 0.9;
            animation: floatTulips 6s infinite ease-in-out;
        }

        @keyframes floatTulips {
            0% { transform: translateY(100vh) scale(0.8); opacity: 1; }
            100% { transform: translateY(-15vh) scale(1.8); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Happy Valentine's Day Animation -->
    <div class="valentine-header" id="valentineHeader"></div>

    <div class="floating-elements"></div>

    <div class="container">
        <h1>VALENTINO</h1>
        <div class="box">
            <input type="text" placeholder="Your Name">
            <input type="text" placeholder="Partner's Name">
            <button class="btn" onclick="goToQuiz()">Begin Your Love Journey</button>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="backgroundMusic" loop>
        <source src="your-music-file.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <button class="music-btn" onclick="toggleMusic()">🎵 Play/Pause Music</button>

    <script>
        function goToQuiz() {
            window.location.href = "quiz.html"; // Redirects to quiz page
        }

        // Letter by Letter Animation for "HAPPY VALENTINE'S DAY"
        const valentineMessage = "HAPPY VALENTINE'S DAY";
        let letterIndex = 0;
        function showLetterByLetter() {
            if (letterIndex < valentineMessage.length) {
                document.getElementById('valentineHeader').innerHTML += valentineMessage[letterIndex];
                letterIndex++;
                setTimeout(showLetterByLetter, 200); // Adjust speed of animation
            }
        }
        showLetterByLetter();

        // Music Control
        let musicPlaying = false;
        const music = document.getElementById("backgroundMusic");

        function toggleMusic() {
            if (musicPlaying) {
                music.pause();
            } else {
                music.play();
            }
            musicPlaying = !musicPlaying;
        }

        // Create Floating Tulips
        function createTulip() {
            const tulip = document.createElement('div');
            tulip.innerHTML = '🌷';
            tulip.classList.add('tulip');
            tulip.style.left = Math.random() * 100 + 'vw';
            tulip.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.querySelector('.floating-elements').appendChild(tulip);
            setTimeout(() => tulip.remove(), 6000);
        }
        setInterval(createTulip, 300);

    </script>
</body>
</html>
