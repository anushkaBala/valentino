<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Love Letter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Playfair+Display:wght@500&display=swap');

        body {
            background: linear-gradient(180deg, #0d021f, #200233);
            color: white;
            text-align: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            position: relative;
        }

        .scroll-container {
            background: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            background-color: #2d112b;
            color: #ffcccc;
            padding: 40px;
            border-radius: 20px;
            max-width: 700px;
            margin: 60px auto;
            box-shadow: 0 0 25px rgba(255, 0, 150, 0.6);
            position: relative;
            font-size: 22px;
            font-family: 'Dancing Script', cursive;
            border: 10px solid rgba(255, 0, 150, 0.3);
            text-align: left;
            line-height: 1.7;
            min-height: 250px;
        }

        .scroll-header {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            color: #ff5b99;
        }

        .heart-icon {
            font-size: 40px;
            color: red;
            margin-bottom: 15px;
            text-align: center;
        }

        .falling-tulips {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .falling-tulip {
            position: absolute;
            font-size: 60px; /* Bigger glowing tulips */
            text-shadow: 0 0 20px yellow, 0 0 40px yellow; /* Strong glowing effect */
            opacity: 0.9;
            animation: fallTulip 6s linear infinite;
        }

        @keyframes fallTulip {
            from { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(100vh) rotate(180deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <div class="heart-icon">❤️</div>
        <div class="scroll-header">My dear Valentine,</div>
        <p id="letterText"></p>
    </div>

    <div class="falling-tulips"></div>

    <script>
        const letters = [
            "From the moment our eyes met, my heart knew it had found its home. You are the melody to my silent songs, the light to my darkest nights. Every moment spent with you feels like poetry written by the universe, carefully crafting our story with love, laughter, and endless dreams. I cherish the way your laughter fills the air, the warmth of your touch, and the kindness that radiates from your soul. You are my greatest adventure, my sweetest dream, my forever. With every heartbeat, I love you more, deeper, stronger. No distance, no time, no force in this universe could ever change what you mean to me. I promise to stand by your side, to love you fiercely, and to cherish every second with you. My heart belongs to you, now and forever."
        ];

        function typeLetter(text, element, speed = 50) { 
            let words = text.split(" ");
            let index = 0;
            function type() {
                if (index < words.length) {
                    element.innerHTML += words[index] + " ";
                    index++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        const randomLetter = letters[Math.floor(Math.random() * letters.length)];
        const letterElement = document.getElementById("letterText");

        setTimeout(() => {
            typeLetter(randomLetter, letterElement);
        }, 500); 

        function createFallingTulips() {
            const container = document.querySelector(".falling-tulips");
            for (let i = 0; i < 40; i++) {
                let tulip = document.createElement("span");
                tulip.className = "falling-tulip";
                tulip.innerHTML = "🌷";
                tulip.style.left = Math.random() * 100 + "vw";
                tulip.style.top = Math.random() * -50 + "vh";
                tulip.style.animationDuration = (Math.random() * 4 + 3) + "s"; 
                container.appendChild(tulip);
            }
        }

        createFallingTulips();
    </script>

</body>
</html>
